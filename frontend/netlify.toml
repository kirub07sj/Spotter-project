# Alternative to vercel.json. Set VITE_API_BASE_URL and VITE_MAP_STYLE_URL in the site settings.
[build]
  command = "pnpm build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
